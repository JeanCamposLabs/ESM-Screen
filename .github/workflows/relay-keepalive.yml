name: Keep lofi relay alive

# Pings the Render relay every 10 minutes while the screens are on, so it never
# hits the 15-minute idle spin-down. The first run each morning wakes the
# service from the overnight spin-down; subsequent runs keep it warm so TVs
# connect instantly. Pair with the SELF_URL self-ping in radio-relay/server.js
# and the keepalive the TV page itself sends while the relay is playing.
#
# The screens run 07:00-23:00 Europe/Amsterdam, Monday to Saturday.
# Schedule: every 10 min, Mon-Sat, 05:00-21:59 UTC
#   Summer (CEST, UTC+2) → 07:00-23:59 local
#   Winter (CET,  UTC+1) → 06:00-22:59 local
on:
  schedule:
    - cron: '*/10 5-21 * * 1-6'
  workflow_dispatch:   # allow a manual trigger from the Actions tab

# This job only sends one curl; it needs no access to the repository at all.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping relay
        run: |
          curl -fsS --max-time 30 https://esm-lofi-relay.onrender.com/healthz \
            && echo "relay ok" \
            || echo "relay not responding — may be cold-starting (next ping in 10 min)"
