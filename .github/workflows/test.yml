name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: JavaScript contract
        run: |
          node --check wall-background.js
          node --check app.js
          node --check shared.js
          node --test tests/wall-background.test.js
      - name: Optional Cast fallback
        run: |
          python3 -m py_compile cast-follower/cast_follower.py cast-follower/test_cast_follower.py
          cd cast-follower
          python3 -m unittest test_cast_follower.py
