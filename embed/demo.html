<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESM Backdrop — demo</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="esm-backdrop.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    /* Whatever the host page draws on top of the backdrop goes above it. */
    .overlay { position: fixed; left: 3vmin; bottom: 3vmin; z-index: 5; color: #fff; font: 2vmin/1.4 system-ui, sans-serif; opacity: .8; text-shadow: 0 .3vmin 1.5vmin rgba(0,0,0,.6); }
    .overlay small { display: block; opacity: .7; }
  </style>
</head>
<body>
  <!-- The backdrop mounts itself as a fixed full-screen layer. Put your own
       content on top (z-index above 0), or pass { el: "#someBox" } to fill a box. -->
  <div class="overlay"><span id="name">…</span><small id="meta">ESM Backdrop demo · ?interval=3&palette=orange&disc=1&categories=space,earth,nature,abstract</small></div>

  <script src="esm-backdrop.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var here = location.pathname.replace(/[^/]*$/, "");            // folder of this page
      var inRepo = /\/embed\/$/.test(here);                          // served from the ESM-Screen site/repo?
      var cats = q.get("categories");
      ESMBackdrop.mount({
        // In the repo the images live one level up; in the unpacked zip they sit next to this file.
        base: inRepo ? here.replace(/embed\/$/, "") : here,
        manifest: inRepo ? ["assets/backgrounds.json"] : ["backgrounds.json", "assets/backgrounds.json"],
        intervalMinutes: q.get("interval") != null ? Number(q.get("interval")) : 3,
        palette: q.get("palette") || "orange",
        disc: q.get("disc") !== "0",
        categories: cats ? cats.split(",") : ["space", "earth", "nature", "abstract"],
        onChange: function (s) { document.getElementById("name").textContent = s.name + " · " + s.cat + " · " + (s.index + 1) + "/" + s.total; }
      });
    })();
  </script>
</body>
</html>
